<div class="operator-box">

  <div class="syntax-block">
    <div class="syntax-label">Syntax</div>
    <pre [innerText]="syntaxExample"></pre>
  </div>

  <h2>forkJoin()</h2>
  <p class="definition">Runs all Observables in parallel, then emits once when ALL complete — ideal for parallel API calls.</p>
  <button (click)="run()">Run 3 parallel "API calls"</button>
  <p *ngIf="loading">⏳ Waiting for all to complete...</p>
  <ul>
    <li *ngFor="let item of results">{{ item }}</li>
  </ul>
</div>
