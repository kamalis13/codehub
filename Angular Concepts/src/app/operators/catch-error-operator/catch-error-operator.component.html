<div class="operator-box">

  <div class="syntax-block">
    <div class="syntax-label">Syntax</div>
    <pre [innerText]="syntaxExample"></pre>
  </div>

  <h2>catchError()</h2>
  <p class="definition">Catches an error in the stream and returns a fallback Observable so the app doesn't crash.</p>
  <button (click)="runSuccess()">Success Case</button>
  <button (click)="runError()">Error Case (caught)</button>
  <ul>
    <li *ngFor="let item of results">{{ item }}</li>
  </ul>
</div>
