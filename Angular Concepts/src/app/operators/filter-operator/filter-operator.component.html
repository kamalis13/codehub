<div class="operator-box">

  <div class="syntax-block">
    <div class="syntax-label">Syntax</div>
    <pre [innerText]="syntaxExample"></pre>
  </div>

  <h2>filter()</h2>
  <p class="definition">Only passes values downstream that satisfy the given condition.</p>
  <button (click)="run()">Run filter() — even numbers only</button>
  <ul>
    <li *ngFor="let item of results">{{ item }}</li>
  </ul>
</div>
