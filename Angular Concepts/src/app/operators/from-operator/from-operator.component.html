<div class="operator-box">

  <div class="syntax-block">
    <div class="syntax-label">Syntax</div>
    <pre [innerText]="syntaxExample"></pre>
  </div>

  <h2>from()</h2>
  <p class="definition">Converts an array, Promise, or iterable into an Observable stream — emits each item one by one.</p>
  <button (click)="runArray()">From Array</button>
  <button (click)="runPromise()">From Promise</button>
  <ul>
    <li *ngFor="let item of results">{{ item }}</li>
  </ul>

</div>
