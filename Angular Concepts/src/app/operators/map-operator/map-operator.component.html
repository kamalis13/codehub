<div class="operator-box">

  <div class="syntax-block">
    <div class="syntax-label">Syntax</div>
    <pre [innerText]="syntaxExample"></pre>
  </div>

  <h2>map()</h2>
  <p class="definition">Transforms each value emitted by the source Observable using a function. Like a conveyor belt machine — input goes in, modified output comes out.</p>
  <button (click)="run()">Run map() — multiply by 10</button>
  <ul>
    <li *ngFor="let item of results">{{ item }}</li>
  </ul>

</div>
