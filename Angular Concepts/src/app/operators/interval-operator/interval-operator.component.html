<div class="operator-box">

  <div class="syntax-block">
    <div class="syntax-label">Syntax</div>
    <pre [innerText]="syntaxExample"></pre>
  </div>

  <h2>interval()</h2>
  <p class="definition">Emits an incrementing number (0, 1, 2...) every N milliseconds. Runs forever until you call <code>unsubscribe()</code>.</p>
  <button (click)="start()" [disabled]="running">Start (every 1s)</button>
  <button (click)="stop()" [disabled]="!running">Stop</button>
  <p>Count: <strong>{{ count }}</strong></p>
  <ul>
    <li *ngFor="let item of results">{{ item }}</li>
  </ul>

</div>
