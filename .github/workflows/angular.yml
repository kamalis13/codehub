name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - angular-framework
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "Angular Concepts/package-lock.json"

      - name: Install dependencies
        working-directory: Angular Concepts
        run: npm ci

      - name: Build Angular
        working-directory: Angular Concepts
        run: npx ng build --base-href="/codehub/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "Angular Concepts/dist/rxjs-learn/browser"
      
      
      - name: Copy HTML, CSS and JavaScript projects
        working-directory: Angular Concepts
        run: |
          mkdir -p "dist/rxjs-learn/browser/HTML Projects"
          mkdir -p "dist/rxjs-learn/browser/CSS Projects"
          mkdir -p "dist/rxjs-learn/browser/JavaScript Projects"
          cp -R "../HTML Projects/." "dist/rxjs-learn/browser/HTML Projects/"
          cp -R "../CSS Projects/." "dist/rxjs-learn/browser/CSS Projects/"
          cp -R "../JavaScript Projects/." "dist/rxjs-learn/browser/JavaScript Projects/"
      

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4